<div class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #F1F5F6 0%, #E0F2F1 100%);">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background: linear-gradient(135deg, #0F766E 0%, #0891B2 100%); box-shadow: 0 4px 14px rgba(13,148,136,0.35);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-7 h-7" fill="none">
          <path d="M5 5L12 12L19 19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
          <circle cx="5" cy="5" r="2" fill="white"/>
          <circle cx="12" cy="12" r="2" fill="white"/>
          <circle cx="19" cy="19" r="2.2" fill="white"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-ink-100 tracking-tight">TraceLens</h1>
      <p class="text-xs uppercase tracking-widest font-bold mt-1" style="color: #0F766E;">Traceability</p>
    </div>

    <div class="card">
      <h2 class="text-lg font-bold text-ink-100 mb-1">Sign in</h2>
      <p class="text-sm text-ink-400 mb-5">Access your production dashboard</p>

      @if (error()) {
        <div class="mb-4 p-3 rounded-lg text-xs" style="background:#fee2e2;color:#b91c1c">
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="submit()" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-ink-300 uppercase tracking-wider mb-1.5">Username</label>
          <input [(ngModel)]="username" name="username" type="text" class="input" autocomplete="username" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-ink-300 uppercase tracking-wider mb-1.5">Password</label>
          <input [(ngModel)]="password" name="password" type="password" class="input" autocomplete="current-password" />
        </div>
        <button type="submit" [disabled]="loading()" class="btn-primary w-full">
          @if (loading()) { Signing in... } @else { Sign In }
        </button>
      </form>

      <div class="mt-4 pt-4 border-t border-subtle">
        <p class="text-[10px] text-ink-400 text-center">
          <span class="font-semibold text-ink-300">Demo credentials:</span>
          <code class="font-mono">admin</code> / <code class="font-mono">Admin123!</code>
        </p>
      </div>
    </div>

    <p class="text-center text-xs text-ink-400 mt-6">
      JWT-authenticated · 87 tests · MCP + SignalR ready
    </p>
  </div>
</div>
