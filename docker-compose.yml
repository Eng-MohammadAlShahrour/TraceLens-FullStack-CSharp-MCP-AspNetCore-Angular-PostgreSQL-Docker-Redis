services:
  postgres:
    image: postgres:16-alpine
    container_name: tracelens-postgres
    environment:
      POSTGRES_DB: tracelens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - tracelens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tracelens-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  tracelens_pgdata:
